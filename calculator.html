
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #e5e5e5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .calculator {
            width: 320px;
            padding: 20px;
            background: #222;
            border-radius: 15px;
        }

        #display {
            width: 100%;
            height: 65px;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 26px;
            text-align: right;
            border: none;
            border-radius: 8px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
        }

        .operator {
            background: orange;
        }

        .clear {
            background: #e74c3c;
            color: white;
        }

        .equal {
            background: #27ae60;
            color: white;
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" id="display" placeholder="0" readonly>

        <div class="buttons">

            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="press('(')">(</button>
            <button class="operator" onclick="press(')')">)</button>

            <button onclick="press('7')">7</button>
            <button onclick="press('8')">8</button>
            <button onclick="press('9')">9</button>
            <button class="operator" onclick="press('/')">÷</button>

            <button onclick="press('4')">4</button>
            <button onclick="press('5')">5</button>
            <button onclick="press('6')">6</button>
            <button class="operator" onclick="press('*')">×</button>

            <button onclick="press('1')">1</button>
            <button onclick="press('2')">2</button>
            <button onclick="press('3')">3</button>
            <button class="operator" onclick="press('-')">−</button>

            <button onclick="press('0')">0</button>
            <button onclick="press('.')">.</button>
            <button class="operator" onclick="press('%')">%</button>
            <button class="operator" onclick="press('+')">+</button>

            <button class="equal" onclick="calculate()">=</button>

        </div>
    </div>

    <script>

        // Connect HTML display
        let display = document.getElementById("display");

        // 1. Add numbers and operators
        function press(value) {
            display.value += value;
        }

        // 2. Clear display
        function clearDisplay() {
            display.value = "";
        }

        // 3. Delete last character
        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        // 4. Calculate expression
        function calculate() {

            try {

                let expression = display.value;

                // Check empty expression
                if (!expression.trim()) {
                    return;
                }

                // Allow only arithmetic characters
                if (!/^[0-9+\-*/%.()\s]+$/.test(expression)) {
                    throw new Error("Invalid expression");
                }

                // Calculate expression
                let result = Function(
                    '"use strict"; return (' + expression + ')'
                )();

                // Check invalid results
                if (!Number.isFinite(result)) {
                    throw new Error("Invalid calculation");
                }

                // Display final answer
                display.value = Number(result.toPrecision(12));

            }

            catch {
                display.value = "Error";
            }
        }

    </script>

</body>
</html>
